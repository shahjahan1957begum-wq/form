<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form challenge</title>
  </head>
  <body>
    <h1>User Registration Form</h1>
    <form>
      <lable>First Name:</lable>
      <input type="text" />
      <br />
      <br />
      <br />
      <lable>Last name:</lable>
      <input type="text" />
      <br />
      <br />
      <br />
      <lable>password:</lable>
      <input type="password" />
      <br />
      <br />
      <br />
      <lable>Bio:</lable>
      <textarea rows="7" cols="28">Write something hear</textarea>
      <br />
      <br />
      <fieldset>
        <legend>Gender:</legend>
        <input type="radio" name="gender" value="male" />
        <lable>Male</lable>
        <br />
        <input type="radio" name="gender" value="Female" />
        <lable>Female</lable>
        <br />
      </fieldset>
      <br />
      <br />
      <br />
      <fieldset>
        <legend>Interests:</legend>
        <input type="checkbox" value="Music" />
        <lable>Music</lable>
        <br />
        <input type="checkbox" value="Sports" />
        <lable>Sports</lable>
        <br />
        <input type="checkbox" value="Reading" />
        <lable>Reading</lable>
      </fieldset>
      <br />
      <br />
      <br />
      <lable>Country</lable>
      <select>
        <option>United states</option>
        <option>Canada</option>
        <option>Australia</option>
        <option>Othhers</option>
      </select>
      <br />
      <br />
      <br />
     <lable>Choose colour</lable>
      <input type="color"/>
      <br />
      <br />
      <br />
      <lable>profile picture:</lable>
      <input type="file" />
      <br />
      <br />
      <br />
      <lable>Birthday</lable>
      <input type="date" />
      <br />
      <br />
      <br />
      <lable>Email</lable>
      <input type="email" />
      <br />
      <br />
      <br />
      <lable>Website</lable>
      <input type="url" />
      <br />
      <br />
      <br />
      <lable>Search</lable>
      <input type="search" />
      <br />
      <br />
      <br />
      <button>submit</button>
    </form>
  </body>
</html>
